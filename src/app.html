<title>Jumeau numérique du bâtiment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout : barre d'outils en haut, plan 2D / maquette 3D à gauche, fiche de l'étagère à droite (empilée sous le plan sur mobile) */
:root{
  --bg:#EDF1F7; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#12223F; --muted:#56637A; --line:#D3DAE6; --grid:#DFE5EF;
  --accent:#B9661F; --accent-ink:#FFFFFF; --sel:#E01B1B; --pink:#F7A8C8; --pink-ink:#D9628F; --steel:#264D80; --match:#E01B1B; --danger:#B3261E; --ok:#2E7D4F;
  --occ0:#FFFFFF; --occ1:#F7E5CC; --occ2:#EBBF86; --occ3:#D48A3F;
  --floor:#E3E8F0; --carton:#DFA15E; --zone:#264D80; --wood:#4E3020;
  --brand:#122C58; --brand-2:#1C3D73; --brand-ink:#FFFFFF; --brand-muted:#B9C6DD;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1428; --surface:#111E38; --surface-2:#172746; --ink:#E7ECF5; --muted:#9AA8C0; --line:#25365A; --grid:#1A2A4A;
  --accent:#E3A35F; --accent-ink:#0A1428; --sel:#FF4D4D; --pink:#F59BC0; --pink-ink:#C94F7E; --steel:#86A9DA; --match:#FF4D4D; --danger:#F08B82; --ok:#6FC08F;
  --occ0:#111E38; --occ1:#46392A; --occ2:#86602F; --occ3:#C98A43;
  --floor:#152443; --carton:#B98345; --zone:#86A9DA; --wood:#5E3B26;
  --brand:#0D2148; --brand-2:#163266; --brand-ink:#FFFFFF; --brand-muted:#A6B6D3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1428; --surface:#111E38; --surface-2:#172746; --ink:#E7ECF5; --muted:#9AA8C0; --line:#25365A; --grid:#1A2A4A;
  --accent:#E3A35F; --accent-ink:#0A1428; --sel:#FF4D4D; --pink:#F59BC0; --pink-ink:#C94F7E; --steel:#86A9DA; --match:#FF4D4D; --danger:#F08B82; --ok:#6FC08F;
  --occ0:#111E38; --occ1:#46392A; --occ2:#86602F; --occ3:#C98A43;
  --floor:#152443; --carton:#B98345; --zone:#86A9DA; --wood:#5E3B26;
  --brand:#0D2148; --brand-2:#163266; --brand-ink:#FFFFFF; --brand-muted:#A6B6D3; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;padding-inline:16px;padding-block:12px;gap:12px}

/* Barre d'outils */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:linear-gradient(135deg,var(--brand-2),var(--brand));color:var(--brand-ink);border-radius:14px;padding:10px 14px;box-shadow:0 6px 18px rgba(18,44,88,.18)}
.logo{width:48px;height:48px;flex:none;display:block}
.bar .seg,.bar .btn,.bar .search input{color:var(--ink)}
.bar .seg{border-color:transparent}
.bar .seg button[aria-pressed="true"]{background:var(--carton);color:#12223F}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand small{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand-muted)}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{position:relative;flex:1 1 220px;max-width:340px}
.search input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2}
.results{color:var(--ink);position:absolute;z-index:20;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:320px;overflow:auto}
.results button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;cursor:pointer;border-bottom:1px solid var(--line)}
.results button:last-child{border-bottom:0}
.results button:hover,.results button:focus-visible{background:var(--surface-2)}
.results .empty{padding:10px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.small{padding:4px 9px;font-size:13px}

/* Zone principale */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px}
.stage{position:relative;min-height:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stage svg#plan{width:100%;height:100%;display:block;touch-action:none;user-select:none}
.stage canvas{width:100%;height:100%;display:block;touch-action:none}
.stage-note{position:absolute;left:12px;bottom:10px;font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--surface);padding:2px 6px;border-radius:4px;pointer-events:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:var(--muted)}
.overlay h2{margin:0;color:var(--ink);font-family:var(--f-display);font-size:24px}
.stage-acts{position:absolute;top:8px;right:56px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;z-index:5}
.stage-acts .btn{min-height:40px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.zoom{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.zoom svg,.tools svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tools{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.tools button{min-height:48px;min-width:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:11px;font-weight:500;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.tools button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.float{position:absolute;top:8px;left:8px;right:56px;max-width:400px;max-height:calc(100% - 16px);overflow:auto;background:var(--surface);border:2px solid var(--sel);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.22);padding:14px;display:flex;flex-direction:column;gap:14px;z-index:6}
.float{gap:10px;padding:10px}
.fhead{display:flex;align-items:center;gap:8px}
.fhead h2{flex:1;min-width:0;margin:0;font-size:24px;line-height:1}
.float .lvl{min-height:40px;grid-template-columns:40px minmax(0,1fr);border-bottom-width:4px}
.float .lvl .tag{font-size:16px}
.float .lvl .cells{padding:5px 6px;gap:4px}
.float .chip{padding:3px 7px}
.float .add{padding:3px 7px}
.btn.back{flex:none;font-weight:600}
.editflag{position:absolute;max-width:calc(100% - 72px);top:10px;left:10px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px}

/* Plan SVG */
.grid line{stroke:var(--grid);stroke-width:.03}
.grid line.major{stroke:var(--line);stroke-width:.05}
.walls{fill:none;stroke:var(--ink);stroke-width:.22}
.wall{fill:none;stroke:var(--ink);stroke-width:.22;stroke-linecap:square}
.door{stroke:var(--accent);stroke-width:.06}
.door-arc{fill:none;stroke:var(--accent);stroke-width:.04;stroke-dasharray:.12 .08}
.wall.sel{stroke:var(--accent);stroke-width:.3}
.door-hinge{fill:var(--accent)}
.win-frame{stroke:var(--ink);stroke-width:.22}
.win-frame.sel{stroke:var(--accent)}
.win-glass{stroke:var(--surface);stroke-width:.12}
.win-mid{stroke:var(--steel);stroke-width:.04}
.rack.coffre .shape.shape{fill:var(--ink)}
.rack.coffre text{fill:var(--surface)}
.rack.bureau .shape.shape{fill:var(--wood)}
.rack.table .shape.shape{fill:var(--carton)}
.rack.table text{fill:var(--ink)}
.rack.roulette.occ0 .shape.shape{fill:var(--steel);fill-opacity:.25}
.rack.roulette text{fill:var(--ink)}
.rack.sol .shape.shape{fill:var(--occ2);fill-opacity:.55;stroke:var(--accent);stroke-dasharray:.08 .06}
.rack.sol text{fill:var(--ink)}
.rack.lapin .shape.shape,.rack.chien .shape.shape{fill:transparent;stroke:transparent}
.rack.lapin.sel .shape.shape,.rack.chien.sel .shape.shape{stroke:var(--sel)}
.dog{fill:#1B1714;stroke:#000;stroke-width:.015}
.dog-ear{fill:#2A231E;stroke:#000;stroke-width:.015}
.dog-tan{fill:#A8612B}
.dog-nose{fill:#000}
.dog-eye{fill:#3B2412}
.dog-shine{fill:#FFFFFF;fill-opacity:.85}
.dog-mouth{fill:none;stroke:#2B1608;stroke-width:.025;stroke-linecap:round}
.bun{fill:var(--pink);stroke:var(--pink-ink);stroke-width:.02}
.bun-in{fill:var(--pink-ink)}
.bun-tail{fill:#FFFFFF;stroke:var(--pink-ink);stroke-width:.015}
.bun-eye{fill:#2A1A22}
.rack.bureau text{fill:#F3E9DF}
.empty-hint{fill:var(--muted);font-family:var(--f-body);font-size:.6px;text-anchor:middle}
.door-gap{stroke:transparent;stroke-width:.22}
.door-gap.sel{stroke:var(--accent);stroke-opacity:.5}
.wall-hit{fill:none;stroke:transparent;stroke-width:1;stroke-linecap:round;cursor:pointer}
.walltool .rack{pointer-events:none;opacity:.55}
.handle{cursor:grab}
.handle-hit{fill:var(--accent);fill-opacity:.14}
.handle-dot{fill:var(--surface);stroke:var(--accent);stroke-width:.12}
.pv{stroke:var(--accent);stroke-width:.22;stroke-linecap:square}
.pv-door{stroke-dasharray:.2 .12;stroke-width:.14}
.pv-dot{fill:var(--accent)}
.pv-erase{stroke:var(--danger);stroke-width:.42;stroke-linecap:butt}
.pv-label{fill:var(--ink);font-family:var(--f-mono);font-weight:500;font-size:.6px;text-anchor:middle;paint-order:stroke;stroke:var(--surface);stroke-width:.2px;pointer-events:none}
.wall-tag.sel{fill:var(--ink);font-weight:500}
.wall-tag{fill:var(--accent);font-family:var(--f-mono);font-size:.42px;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--surface);stroke-width:.14px;pointer-events:none}
.zone{fill:var(--zone);fill-opacity:.06;stroke:var(--zone);stroke-opacity:.45;stroke-width:.06;stroke-dasharray:.3 .2}
.zone-label{fill:var(--zone);font-family:var(--f-mono);font-size:.55px;letter-spacing:.04px;text-transform:uppercase}
.dim{fill:var(--muted);font-family:var(--f-mono);font-size:.5px}
.dimline{stroke:var(--muted);stroke-width:.04}
.rack{cursor:pointer}
.rack .shape{stroke:var(--steel);stroke-width:.08}
.rack.occ0 .shape{fill:var(--occ0)} .rack.occ1 .shape{fill:var(--occ1)} .rack.occ2 .shape{fill:var(--occ2)} .rack.occ3 .shape{fill:var(--occ3)}
.rack text{fill:var(--ink);font-family:var(--f-display);font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.rack.match .shape{stroke:var(--match);stroke-width:.26}
.rack.match .shape.shape{fill:color-mix(in srgb,var(--match) 28%,var(--surface))}
.rack.match text{fill:var(--ink)}
.rack.sel .shape{stroke:var(--sel);stroke-width:.26}
.editing .rack{cursor:grab}
.rack.dragging{cursor:grabbing;opacity:.85}
@media (prefers-reduced-motion:no-preference){.rack.match .shape{animation:pulse 1.4s ease-in-out infinite}}
@keyframes pulse{50%{stroke-opacity:.35}}

/* Panneau latéral */
.panel{min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;align-items:flex-start;gap:10px}
.ph > div{flex:1;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel h2{margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;text-wrap:balance}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:4px}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
h3{margin:0 0 8px;font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stats4{grid-template-columns:repeat(5,1fr)}
.stats4 .stat{padding:6px}
.stats4 .stat b{font-size:22px}
@media (max-width:420px){.stats4{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--surface-2);border-radius:6px;padding:8px 10px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border:1.5px solid var(--steel);border-radius:2px;vertical-align:-1px;margin-right:5px}
.note{background:var(--surface-2);border-left:3px solid var(--match);padding:10px 12px;border-radius:4px;display:flex;flex-direction:column;gap:8px}
.note .row{display:flex;flex-wrap:wrap;gap:8px}
.hint{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column}
.list button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 0;cursor:pointer}
.list button:hover .nm{color:var(--accent)}
.list .sub{font-size:12px;color:var(--muted)}
.addr{font-family:var(--f-mono);font-size:12px;color:var(--steel);white-space:nowrap}

/* Vue en élévation de l'étagère */
.elev{display:flex;flex-direction:column;border-left:4px solid var(--steel);border-right:4px solid var(--steel);background:var(--surface-2)}
.lvl{display:grid;grid-template-columns:48px minmax(0,1fr);border-bottom:5px solid var(--accent);min-height:58px}
.lvl.cur{background:color-mix(in srgb,var(--accent) 9%,transparent)}
.lvl.extra{border-bottom-color:var(--danger)}
.lvl .tag{display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;border-right:1px dashed var(--line)}
.lvl .tag small{font-family:var(--f-mono);font-weight:400;font-size:10px;color:var(--muted)}
.lvl .cells{display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;padding:7px 8px}
.chip{display:inline-flex;align-items:baseline;gap:6px;max-width:100%;border:1px solid color-mix(in srgb,var(--carton) 55%,var(--line));background:color-mix(in srgb,var(--carton) 16%,var(--surface));border-radius:4px;padding:4px 8px;cursor:pointer;text-align:left}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.hit{border-color:var(--match);box-shadow:0 0 0 2px color-mix(in srgb,var(--match) 35%,transparent)}
.chip.open{border-color:var(--accent)}
.add{border:1px dashed var(--line);background:none;border-radius:4px;padding:4px 8px;color:var(--muted);cursor:pointer}
.add:hover{border-color:var(--accent);color:var(--accent)}
.ground{font-family:var(--f-mono);font-size:10px;text-align:center;color:var(--muted);padding:3px;letter-spacing:.1em;text-transform:uppercase;background:var(--floor)}

/* Formulaires */
.form{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.form input,.form select,.form textarea{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:14px;color:var(--ink)}
.form textarea{min-height:56px;resize:vertical}
.form .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.form .acts .sp{flex:1}
.who{font-size:12px;color:var(--muted)}
.zrow{display:grid;grid-template-columns:minmax(0,2fr) repeat(4,minmax(0,1fr)) auto;gap:6px;align-items:end}
.zrow input{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:13px}
.zhead{font-size:11px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:50;max-width:calc(100% - 32px)}
.toast.err{background:var(--danger);color:var(--surface)}

@media (max-width:860px){
  html,body{height:auto}
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .stage{height:56svh;min-height:300px}
  .app.editing .stage{height:72svh}
  .panel{overflow:visible}
  .search{max-width:none;order:5;flex-basis:100%}
}

/* ---------- Onglet Visites clients ---------- */
.tabs button{padding:7px 12px;font-size:15px}
.mode-visites .plan-only{display:none!important}
.visits{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:24px}
.visits > *{flex-shrink:0}
.vhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.vhead h2{margin:0;font-family:var(--f-display);font-size:28px;line-height:1;flex:1;min-width:0;text-wrap:balance}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.vitem{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.vitem:hover,.vitem:focus-visible{border-color:var(--accent)}
.vitem b{font-family:var(--f-display);font-size:20px}
.vmeta{font-size:13px;color:var(--muted)}
.chip-s{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--surface-2);color:var(--muted)}
.chip-s.done{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip-s.live{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.vform{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.vform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.vform input,.vform textarea{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px;color:var(--ink)}
.vform .full{grid-column:1/-1}
.vform textarea{min-height:64px;resize:vertical}
.vacts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.vacts .sp{flex:1}
.btn.big{padding:11px 16px;font-size:15px}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .txt{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:15px}
.prog .txt b{font-family:var(--f-display);font-size:24px}
.bar-o{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar-i{height:100%;background:var(--ok);border-radius:6px;transition:width .3s}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.vtable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.vtable{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
.vtable th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.vtable td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.vtable tr:last-child td{border-bottom:0}
.vtable tr.seen td{background:color-mix(in srgb,var(--ok) 10%,transparent)}
.vtable tr.seen .lotno{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--ok) 60%,transparent)}
.vtable .lotno{font-family:var(--f-display);font-weight:700;font-size:19px}
.vtable .sub{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.vtable .time{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ck{appearance:none;-webkit-appearance:none;width:38px;height:38px;border:2.5px solid var(--muted);border-radius:8px;background:var(--surface);cursor:pointer;display:grid;place-items:center;margin:0}
.ck:checked{background:var(--ok);border-color:var(--ok)}
.ck:checked::after{content:"";width:12px;height:20px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg) translate(-2px,-2px)}
.ck:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stat-vu{font-weight:600;color:var(--ok)}
.stat-ap{color:var(--muted)}
.xbtn{border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;padding:4px 8px}
.xbtn:hover{color:var(--danger)}
.confirm-row td{background:color-mix(in srgb,var(--danger) 10%,transparent)!important}
.addbox{display:flex;flex-direction:column;gap:8px}
.addbox textarea{min-height:80px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px;color:var(--ink);font-family:var(--f-mono)}
.addbox input{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px;color:var(--ink)}
.addlist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.addlist label{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.addlist label:last-child{border-bottom:0}
.addlist input[type=checkbox]{width:22px;height:22px}
.addlist .in{color:var(--muted);font-size:12px;margin-left:auto}
.sigrow{display:flex;flex-wrap:wrap;gap:10px}
.sigbox{flex:1 1 220px;border:1px dashed var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.sigbox img{max-width:100%;height:70px;object-fit:contain;background:#fff;border-radius:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:60;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;padding:16px;width:min(640px,100%);display:flex;flex-direction:column;gap:10px}
.modal canvas{width:100%;height:200px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none}
.hist{font-size:12px;color:var(--muted);font-family:var(--f-mono);display:flex;flex-direction:column;gap:2px;max-height:160px;overflow:auto}
@media (max-width:860px){.visits{overflow:visible}}
.vtabs{position:sticky;top:0;z-index:8;display:flex;gap:6px;overflow-x:auto;padding:6px;margin:0 -2px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:thin}
.vtab{flex:none;display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);max-width:220px}
.vtab.on{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.vtab.all{padding:8px 14px;font-weight:600;cursor:pointer;font-size:14px}
.vtab-go{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:1px;padding:6px 4px 6px 12px;min-width:0}
.vtab-n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.vtab-p{font-family:var(--f-mono);font-size:11px;opacity:.75}
.vtab-x{border:0;background:none;color:inherit;opacity:.6;font-size:20px;line-height:1;padding:0 10px;cursor:pointer}
.vtab-x:hover{opacity:1}
.vtab-go:focus-visible,.vtab-x:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
.chip-s.open{margin-left:6px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--steel)}
.vtypes{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.vtype{flex:1 1 220px;display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.vtype.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.vtype input{width:22px;height:22px;margin:0}
.vtype span{display:flex;flex-direction:column;gap:2px}
.vtype small{color:var(--muted)}
.vpre{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.vpre input{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:16px;color:var(--ink)}

/* Page de connexion (profils) */
.login{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,var(--brand-2),var(--brand));display:grid;place-items:center;padding:16px;overflow:auto}
.login-card{background:var(--surface);color:var(--ink);border-radius:16px;padding:22px;width:min(440px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.login-head{display:flex;align-items:center;gap:14px}
.login-head img{width:64px;height:64px;flex:none}
.login-head small{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.login-head h1{margin:0;font-family:var(--f-display);font-size:30px;line-height:1.05}
.login-hint{margin:0;font-size:13px;color:var(--muted)}
.login-q,.login-new input{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:16px;width:100%}
.login-list{display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow:auto}
.login-row{display:flex;gap:6px;align-items:stretch}
.login-row .login-p{flex:1;min-width:0}
.login-del{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:0 12px;font-size:13px;cursor:pointer}
.login-del:hover{color:var(--danger);border-color:var(--danger)}
.login-del.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.login-p{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:16px;font-weight:500;cursor:pointer}
.login-p:hover,.login-p:focus-visible{border-color:var(--accent)}
.login-p .av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--carton);color:#12223F;font-family:var(--f-display);font-weight:700;font-size:18px}
.login-new{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.login-new label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.login-err{margin:0;font-size:13px;color:var(--danger)}
.profil-btn{max-width:220px;overflow:hidden;text-overflow:ellipsis}
</style>

<div class="app" id="app">
  <header class="bar">
    <img class="logo" src="logo-96.png?v=3" alt="" width="48" height="48">
    <div class="brand"><small id="brandSub">LTC · Jumeau numérique</small><h1 id="bname">Bâtiment</h1></div>
    <div class="seg tabs" role="tablist" aria-label="Onglets">
      <button id="tabPlan" role="tab" aria-pressed="true">Plan</button>
      <button id="tabVis" role="tab" aria-pressed="false">Visites clients</button>

    <div class="seg plan-only" role="group" aria-label="Type de vue" hidden>

    </div>
    <div class="search plan-only">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Chercher un article, une référence, A2…" autocomplete="off" aria-label="Rechercher">
      <div class="results" id="results" hidden></div>
    </div>
  </header>
  <div class="main plan-only">
    <section class="stage" id="stage">

      <canvas id="v3d" hidden></canvas>
      <div class="overlay" id="overlay" hidden></div>

      <div class="float" id="float" hidden role="dialog" aria-label="Détail de l'élément"></div>
      <div class="stage-acts"><button class="btn" id="editBtn" hidden>Modifier le plan</button><button class="btn primary" id="addRack" hidden>+ Étagère</button></div>
      <div class="zoom" id="zoom">
        <button id="zIn" aria-label="Zoomer">+</button>
        <button id="zOut" aria-label="Dézoomer">−</button>
        <button id="zFit" aria-label="Recadrer sur le bâtiment" title="Recadrer"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>

      <div class="tools" id="tools" hidden role="toolbar" aria-label="Outils du plan">

        <button data-tool="tracer"><svg viewBox="0 0 24 24"><path d="M4 20V8h12"/><circle cx="16" cy="8" r="2"/></svg>Tracer</button>
        <button data-tool="porte"><svg viewBox="0 0 24 24"><path d="M4 20h16M6 20V6M6 6a12 12 0 0 1 12 12"/></svg>Porte</button>
        <button data-tool="fenetre"><svg viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M3 12h18"/></svg>Fenêtre</button>
        <button data-tool="gomme"><svg viewBox="0 0 24 24"><path d="M3 12h6M15 12h6M10 9l4 6M14 9l-4 6"/></svg>Gomme</button>
        <button data-tool="supprimer"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>Supprimer</button>
        <button data-tool="etageres"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14"/><path d="M4 10h16M4 15h16"/></svg>Étagères</button>
        <button id="undo"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2"/></svg>Annuler</button>
      </div>
      <div class="stage-note" id="stageNote">Plan vu de dessus</div>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
  <section class="visits" id="visits" hidden></section>
</div>

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
function sv(tag, attrs = {}) { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); return e; }
const fmt = n => (+n || 0).toLocaleString("fr-FR", { maximumFractionDigits: 2 });
// Unité du plan : la longueur d'une étagère (1 ét.)
function fu(n, long) {
  n = +n || 0; const q = Math.round(n * 4) / 4;
  let t;
  if (Math.abs(q - n) < .02) { const i = Math.floor(q), f = q - i, g = { .25: "¼", .5: "½", .75: "¾" }[f] || ""; t = (i ? String(i) : "") + (g ? (i ? " " : "") + g : ""); if (!t) t = "0"; }
  else t = fmt(n);
  return t + (long ? (n > 1 ? " étagères" : " étagère") : " ét.");
}
const num = (v, d = 0) => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : d; };
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const round1 = n => Math.round(n * 10) / 10;
const rtf = new Intl.RelativeTimeFormat("fr", { numeric: "auto" });
function ago(iso) {
  if (!iso) return "";
  const s = (new Date(iso) - Date.now()) / 1000;
  const a = Math.abs(s);
  if (a < 60) return "à l'instant";
  if (a < 3600) return rtf.format(Math.round(s / 60), "minute");
  if (a < 86400) return rtf.format(Math.round(s / 3600), "hour");
  return rtf.format(Math.round(s / 86400), "day");
}

function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, err ? 5000 : 2200);

function fail(e) {
  const code = e && e.code;
  if (code === "invalid_argument") { S.canWrite = false; render(); toast("Vous avez un accès en lecture seule à ce bâtiment.", true); }
  else if (code === "quota_exceeded") toast("La base est pleine : supprimez des articles avant d'en ajouter.", true);
  else toast("L'enregistrement a échoué. Vérifiez la connexion et réessayez.", true);
}
async function write(fn) { try { await fn(); return true; } catch (e) { fail(e); return false; } }

/* ---------- Données dérivées ---------- */
const racksSorted = () => [...S.racks.values()].sort((a, b) => String(a.code).localeCompare(String(b.code), "fr", { numeric: true }));
const itemsOf = (rid, lvl) => [...S.items.values()].filter(i => i.rackId === rid && (lvl == null || i.niveau === lvl)).sort((a, b) => String(a.nom).localeCompare(String(b.nom), "fr"));
const zoneOf = id => (S.config?.zones || []).find(z => z.id === id);
const addr = it => { const r = S.racks.get(it.rackId); return (r ? r.code : "?") + "-N" + it.niveau; };
function occClass(r) {
  if (r.type === "roulette") { // roulettes : selon le nombre de contenants posés
    const c = itemsOf(r.id).reduce((s, i) => s + (+i.qte || 1), 0);
    return !c ? 0 : c <= 2 ? 1 : c <= 3 ? 2 : 3;
  }
  const n = Math.max(1, r.niveaux | 0);
  const used = new Set(itemsOf(r.id).map(i => i.niveau)).size;
  if (!used) return 0;
  const f = used / n;
  return f < .34 ? 1 : f < .67 ? 2 : 3;
}
function itemHit(it, q) { return norm(it.nom).includes(q) || norm(it.ref).includes(q) || norm(it.note).includes(q); }
function searchResults() {
  const q = norm(S.q.trim()); if (!q) return { items: [], racks: new Set() };
  const items = [...S.items.values()].filter(i => itemHit(i, q) && S.racks.has(i.rackId));
  const racks = new Set(items.map(i => i.rackId));
  for (const r of S.racks.values()) if (norm(r.code).startsWith(q)) racks.add(r.id);
  return { items, racks };
}

/* ---------- Plan 2D ---------- */
const SNAP = .5;
const r2 = n => Math.round(n * 100) / 100;
const snap = n => Math.round(n / SNAP) * SNAP;
const walls = () => S.draftMurs || (Array.isArray(S.config?.murs) ? S.config.murs : []);
function bounds() {
  const c = S.config, m = walls();
  if (!m.length) return { x0: 0, y0: 0, x1: num(c?.largeur, 30), y1: num(c?.profondeur, 20) };
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const w of m) { x0 = Math.min(x0, w.x1, w.x2); x1 = Math.max(x1, w.x1, w.x2); y0 = Math.min(y0, w.y1, w.y2); y1 = Math.max(y1, w.y1, w.y2); }
  return { x0, y0, x1, y1 };
}
let VB = null; // vue zoomée {x,y,w,h} ; null = cadrage automatique
function fitVB() {
  // Cadrage par défaut : le plan est réduit pour laisser libres les boutons du cadre (Modifier le plan, zoom, outils, légende)
  const b = bounds(), bw = Math.max(b.x1 - b.x0, 1), bh = Math.max(b.y1 - b.y0 + .6, 1);
  const svg = $("#plan"), W = svg.clientWidth || 800, H = svg.clientHeight || 600;
  const pl = 20, pr = 64, pt = 60, pb = S.editMode ? 130 : 36;
  const s = Math.max(1e-3, Math.min((W - pl - pr) / bw, (H - pt - pb) / bh));
  const ex = Math.max(0, (W - pl - pr - bw * s) / 2), ey = Math.max(0, (H - pt - pb - bh * s) / 2);
  return { x: b.x0 - (pl + ex) / s, y: b.y0 - (pt + ey) / s, w: W / s, h: H / s };
}
const wallTool = () => S.editMode && S.tool !== "etageres";

function tokens(text, coll, px) {

    return String(+d) + suf;                                          // numéro complet

function pickColumn(rows) {
  rows = rows.filter(r => r && r.some(c => String(c ?? "").trim() !== ""));
  if (!rows.length) return "";

  let col = head.findIndex(h => /^(lot|lot_number|lot number|n° ?lot|no ?lot|numero( de)? lot|num(ero)?)$/.test(h.trim()));

  fi.addEventListener("change", async () => {
    const f = fi.files && fi.files[0]; if (!f) return;
    try { const t = await readLotsFile(f); st.text = (st.text ? st.text.trim() + "\n" : "") + t; ta.value = st.text; upd(); toast(`Fichier « ${f.name} » lu : ${parseLots(t, coll, px, cat, []).added.length} numéros`); }
    catch (e) { toast(e.message || "Ce fichier n'a pas pu être lu.", true); }
    fi.value = "";
  });
  upd();
  return el("div", { class: "addbox" }, ta,
    el("div", { class: "vacts" }, el("button", { class: "btn", type: "button", text: "Importer un fichier (Excel, CSV, texte)", onclick: () => fi.click() }), fi,
      el("button", { class: "btn small", type: "button", text: "Vider", onclick: () => { st.text = ""; ta.value = ""; upd(); } })), prev);
}
function addNumbers(v, cat, text) {
  const coll = (v.typeVente || "collection") === "collection", px = v.prefixe || "40";
  const r = parseLots(text, coll, px, cat, (v.lots || []).map(l => l.lot));
  if (!r.added.length) { toast(r.dup.length ? "Ces lots sont déjà dans la visite." : (coll ? `Aucun numéro reconnu. Exemple : 077 ou ${px}077.` : "Aucun numéro reconnu. Exemple : 4512."), !r.dup.length); return; }
  const t = new Date().toISOString();
  let h = v.historique || []; for (const x of r.added) h = [...h, { t, action: "ajout", lot: x, par: T.uid || null, ...(cat.has(x) ? {} : { horsBase: true }) }];
  V.addTxt = { text: "" }; V.adding = false;
  patch(v.id, { lots: [...(v.lots || []), ...r.added.map(x => ({ lot: x, ajoute: t, vu: null }))], historique: h });
  toast("Ajoutés : " + lotsMsg(r), !!r.unknown.length);
}
/* ---- Signature sur tablette ---- */
function sigPad(v, key, lab) {
  const cv = el("canvas", { width: 900, height: 300 });
  const ctx = cv.getContext("2d"); ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.strokeStyle = "#111";
  let drawing = false, any = false;
  const pt = e => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) * cv.width / b.width, (e.clientY - b.top) * cv.height / b.height]; };
  cv.addEventListener("pointerdown", e => { drawing = true; any = true; cv.setPointerCapture(e.pointerId); const [x, y] = pt(e); ctx.beginPath(); ctx.moveTo(x, y); });
  cv.addEventListener("pointermove", e => { if (!drawing) return; const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); });
  const up = () => { drawing = false; }; cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  const close = () => m.remove();
  const m = el("div", { class: "modal" }, el("div", { class: "box" }, el("strong", { text: lab }), el("span", { class: "vmeta", text: "Signez avec le doigt ou un stylet dans le cadre." }), cv,
    el("div", { class: "vacts" },
      el("button", { class: "btn", text: "Effacer", onclick: () => { ctx.clearRect(0, 0, cv.width, cv.height); any = false; } }),
      el("span", { class: "sp" }),
      el("button", { class: "btn", text: "Annuler", onclick: close }),
      el("button", { class: "btn primary", text: "Valider la signature", onclick: () => {
        if (!any) { toast("Le cadre est vide.", true); return; }
        const out = document.createElement("canvas"); out.width = 450; out.height = 150;
        const o = out.getContext("2d"); o.fillStyle = "#fff"; o.fillRect(0, 0, 450, 150); o.drawImage(cv, 0, 0, 450, 150);
        const sigs = { ...(v.signatures || {}), [key]: { img: out.toDataURL("image/jpeg", .8), t: new Date().toISOString() } };
        patch(v.id, { signatures: sigs, historique: hist(v, "signature", null, { qui: key }) }); close();
      } }))));
  document.body.append(m);
}

/* ---- Compte rendu PDF ---- */
async function exportPdf(v) {
  if (!window.jspdf || !window.jspdf.jsPDF) { toast("Le module PDF n'a pas pu se charger. Rechargez la page.", true); return; }
  const cat = catalog();
  const seen = (v.lots || []).filter(l => l.vu).sort((a, b) => String(a.vu).localeCompare(String(b.vu)));
  const client = `${v.prenom || ""} ${v.nom || ""}`.trim();
  const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
  const W = 210, M = 12, BOT = 284, BLOCK = 98;
  // En-tête compact
  doc.setFont("helvetica", "bold"); doc.setFontSize(15); doc.text("Compte rendu de présentation des lots", M, 17);
  doc.setDrawColor(223, 161, 94); doc.setLineWidth(.7); doc.line(M, 20, W - M, 20);
  doc.setFontSize(9.5);
  const info1 = [["Client : ", client || "—"], ["Visite : ", `${fDate(v.date)}${v.heure ? " à " + v.heure : ""}`]];
  if (v.collab) info1.push(["Accompagné par : ", v.collab]);
  info1.push(["Lots présentés : ", String(seen.length)]);
  let x0 = M;
  info1.forEach(([k, val]) => { doc.setFont("helvetica", "bold"); doc.text(k, x0, 26); x0 += doc.getTextWidth(k); doc.setFont("helvetica", "normal"); doc.text(val, x0, 26); x0 += doc.getTextWidth(val) + 7; });
  const TOP1 = 31, TOP = 14;
  // Liste : choix automatique de la taille et du nombre de colonnes pour tenir sur un recto verso
  const sameDay = l => new Date(l.vu).toLocaleDateString("sv-SE") === v.date;
  const rows = seen.map(l => { const e = info(cat, l.lot); return [l.lot, e.locs.join(" + ") || "—", fmtFormat(e) || "", sameDay(l) ? fT(l.vu) : fDT(l.vu)]; });
  const configs = [];
  for (const [fs, rh] of [[9, 5], [8, 4.4], [7, 3.8], [6.2, 3.3], [5.5, 2.9], [5, 2.6]]) for (const g of [1, 2, 3]) configs.push({ fs, rh, g });
  const cap = c => { const hh = c.rh + .6; return c.g * (Math.floor((BOT - TOP1 - hh) / c.rh) + Math.floor((BOT - BLOCK - TOP - hh) / c.rh)); };
  const okc = configs.filter(c => !(c.g === 3 && c.fs > 7) && !(c.g === 2 && c.fs > 8));
  const C = okc.find(c => cap(c) >= rows.length) || okc[okc.length - 1];
  const gap = 5, gw = (W - 2 * M - (C.g - 1) * gap) / C.g;
  const fr = C.g === 1 ? [.16, .34, .26, .24] : [.2, .3, .27, .23];
  const cw = fr.map(f => f * gw);
  const fit = (s, w) => { s = String(s); if (doc.getTextWidth(s) <= w) return s; while (s.length > 1 && doc.getTextWidth(s + "…") > w) s = s.slice(0, -1); return s + "…"; };
  const heads = ["N° lot", "Localisation", "Format", sameDayAll() ? "Heure" : "Présenté le"];
  function sameDayAll() { return seen.every(sameDay); }
  let page = 1, i = 0, y = TOP1;
  while (i < rows.length) {
    const top = page === 1 ? TOP1 : TOP;
    const bottom = (page >= 2 && rows.length - i <= C.g * Math.floor((BOT - BLOCK - top - C.rh - .6) / C.rh)) ? BOT - BLOCK : BOT;
    const perCol = Math.floor((bottom - top - C.rh - .6) / C.rh);
    for (let g = 0; g < C.g && i < rows.length; g++) {
      const gx = M + g * (gw + gap);
      doc.setFillColor(27, 33, 39); doc.rect(gx, top, gw, C.rh + .6, "F");
      doc.setTextColor(255); doc.setFont("helvetica", "bold"); doc.setFontSize(C.fs);
      let cx = gx; heads.forEach((t, k) => { doc.text(fit(t, cw[k] - 1.6), cx + .8, top + C.rh * .72 + .3); cx += cw[k]; });
      doc.setTextColor(0);
      y = top + C.rh + .6;
      for (let r = 0; r < perCol && i < rows.length; r++, i++) {
        if (r % 2) { doc.setFillColor(242, 243, 240); doc.rect(gx, y, gw, C.rh, "F"); }
        cx = gx;
        rows[i].forEach((t, k) => { doc.setFont("helvetica", k === 0 ? "bold" : "normal"); doc.text(fit(t, cw[k] - 1.6), cx + .8, y + C.rh * .72); cx += cw[k]; });
        y += C.rh;
      }
      doc.setDrawColor(200); doc.setLineWidth(.2); doc.rect(gx, top, gw, y - top);
    }
    if (i < rows.length) { doc.addPage(); page++; }
  }
  // Bloc déclaration + signatures en bas du verso
  if (!rows.length) y = TOP1;
  if (y > BOT - BLOCK) { doc.addPage(); page++; }
  y = BOT - BLOCK + 6;
  doc.setFontSize(10); doc.setFont("helvetica", "normal");
  const decl = doc.splitTextToSize(`Je soussigné(e), ${client || "...................................."}, reconnais avoir pris connaissance des lots listés ci-dessus lors de la visite effectuée à la date indiquée.`, W - 2 * M);
  doc.text(decl, M, y); y += decl.length * 4.6 + 4;
  doc.setFont("helvetica", "bold"); doc.text("Observations :", M, y); doc.setFont("helvetica", "normal"); y += 2.5;
  doc.setDrawColor(180); doc.setLineWidth(.3); doc.rect(M, y, W - 2 * M, 20);
  if (v.observations) { doc.setFontSize(9); doc.text(doc.splitTextToSize(v.observations, W - 2 * M - 6).slice(0, 4), M + 3, y + 5); doc.setFontSize(10); }
  y += 27;
  const bw = (W - 2 * M - 8) / 2, sg = v.signatures || {};
  [["Signature du client", "client", M], ["Signature du représentant", "rep", M + bw + 8]].forEach(([lab, k, x]) => {
    doc.setFont("helvetica", "bold"); doc.text(lab, x, y);
    doc.rect(x, y + 2.5, bw, 30);
    if (sg[k]?.img) { try { doc.addImage(sg[k].img, "JPEG", x + 2, y + 4, bw - 4, Math.min(27, (bw - 4) / 3)); } catch (_) {} }
  });
  y += 39;
  const sd = sg.client?.t || sg.rep?.t;
  doc.setFont("helvetica", "bold"); doc.text("Date de signature :", M, y); doc.setFont("helvetica", "normal");
  doc.text(sd ? new Date(sd).toLocaleDateString("fr-FR") : "____ / ____ / ________", M + 38, y);
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(120); doc.text(`Généré le ${new Date().toLocaleString("fr-FR")} · page ${i}/${pages}`, M, 291); doc.setTextColor(0); }
  const blob = doc.output("blob");
  const fn = `Compte-rendu_${(v.nom || "client").replace(/[^\w\-]+/g, "_")}_${v.date || today()}.pdf`;
  let dl = null; try { dl = await claude.use("downloads"); } catch (_) {}
  if (!dl) { toast("L'enregistrement de fichiers n'est pas disponible dans cette vue.", true); return; }
  try { await dl.save({ filename: fn, data: blob }); patch(v.id, { historique: hist(V.list.get(v.id) || v, "export") }); toast("Compte rendu enregistré"); }
  catch (e) { if (e?.code !== "declined") toast("Le PDF n'a pas pu être enregistré (" + (e?.code || "erreur") + ").", true); }
}

let m0 = "plan"; try { m0 = localStorage.getItem("onglet") || "plan"; } catch (_) {}
if (m0 === "visites") setMode("visites");
const wait = setInterval(() => { if (T.db) { start(); clearInterval(wait); } }, 300);
})();
